name: Lean 4 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Lean & Lake versions
        run: |
          lean --version
          lake --version

      - name: Fetch Mathlib precompiled olean cache
        run: |
          lake exe cache get

      - name: Build Formalization Library
        run: |
          lake build Formalization
